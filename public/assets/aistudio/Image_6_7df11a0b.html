<script>
  let currentAmount = "48.50";
  let isSplitActive = false;
  let activeType = "expense";

  function updateDisplay() {
    const el = document.getElementById("amount-val");
    const saveBtnLabel = document.getElementById("save-btn-label");
    if (el) el.innerText = currentAmount;
    if (saveBtnLabel) {
      const typeLabel = activeType === 'income' ? 'Save Income' : activeType === 'transfer' ? 'Transfer Funds' : 'Save Expense';
      saveBtnLabel.innerText = `${typeLabel} ($${currentAmount})`;
    }
  }

  function adjustAmount(val) {
    let num = parseFloat(currentAmount) || 0;
    num += val;
    currentAmount = num.toFixed(2);
    updateDisplay();
  }

  function roundUpAmount() {
    let num = parseFloat(currentAmount) || 0;
    let nextInt = Math.ceil(num);
    if (nextInt === num) nextInt += 1;
    currentAmount = nextInt.toFixed(2);
    updateDisplay();
  }

  function keypadPress(char) {
    if (currentAmount === "0" || currentAmount === "0.00") {
      currentAmount = char === "." ? "0." : char;
    } else {
      if (char === "." && currentAmount.includes(".")) return;
      currentAmount += char;
    }
    updateDisplay();
  }

  function keypadDelete() {
    if (currentAmount.length <= 1) {
      currentAmount = "0";
    } else {
      currentAmount = currentAmount.slice(0, -1);
    }
    updateDisplay();
  }

  function selectCat(btn) {
    document.querySelectorAll('.cat-pill').forEach(el => {
      el.classList.remove('bg-primary', 'text-on-primary');
      el.classList.add('bg-surface-container-lowest', 'text-on-surface');
      const iconWrap = el.querySelector('div');
      if (iconWrap) {
        iconWrap.classList.remove('bg-surface-container-lowest/20');
        iconWrap.classList.add('bg-surface-container-low', 'text-on-surface-variant');
      }
    });

    btn.classList.add('bg-primary', 'text-on-primary');
    btn.classList.remove('bg-surface-container-lowest', 'text-on-surface');
    const iconWrap = btn.querySelector('div');
    if (iconWrap) {
      iconWrap.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
      iconWrap.classList.add('bg-surface-container-lowest/20');
    }
  }

  function selectPay(btn) {
    document.querySelectorAll('.pay-btn').forEach(el => {
      el.classList.remove('bg-primary', 'text-on-primary');
      el.classList.add('bg-surface-container-low', 'text-on-surface');
      const sub = el.querySelector('.font-label-caps');
      if (sub) {
        sub.classList.remove('text-on-primary-container');
        sub.classList.add('text-on-surface-variant');
      }
    });

    btn.classList.add('bg-primary', 'text-on-primary');
    btn.classList.remove('bg-surface-container-low', 'text-on-surface');
    const sub = btn.querySelector('.font-label-caps');
    if (sub) {
      sub.classList.remove('text-on-surface-variant');
      sub.classList.add('text-on-primary-container');
    }
  }

  function toggleSplit() {
    isSplitActive = !isSplitActive;
    const toggle = document.getElementById("split-toggle");
    const knob = document.getElementById("split-knob");
    if (isSplitActive) {
      toggle.classList.remove('bg-surface-container-highest');
      toggle.classList.add('bg-secondary');
      knob.classList.add('translate-x-5');
      knob.classList.remove('translate-x-0');
    } else {
      toggle.classList.add('bg-surface-container-highest');
      toggle.classList.remove('bg-secondary');
      knob.classList.remove('translate-x-5');
      knob.classList.add('translate-x-0');
    }
  }

  function switchType(type) {
    activeType = type;
    const types = ['expense', 'income', 'transfer'];
    types.forEach(t => {
      const btn = document.getElementById('type-' + t);
      if (t === type) {
        btn.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');
        btn.classList.remove('text-on-surface-variant');
      } else {
        btn.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');
        btn.classList.add('text-on-surface-variant');
      }
    });
    updateDisplay();
  }

  function saveTransaction() {
    const btn = document.getElementById('save-btn');
    btn.classList.add('scale-95', 'bg-secondary');
    setTimeout(() => {
      btn.classList.remove('scale-95', 'bg-secondary');
      if (window.history.length > 1) {
        window.history.back();
      }
    }, 250);
  }
</script></main></body></html>
